# ============================================================================
# Supervisord Configuration for Docker Container
# Manages Flask, MQTT Subscriber, and other services
# ============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Flask API Server
[program:flask_app]
directory=/app
command=gunicorn -c backend/gunicorn_config.py backend.web_server:app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
priority=999
stdout_logfile=/var/log/supervisor/flask_app_out.log
stderr_logfile=/var/log/supervisor/flask_app_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED=1

# MQTT Subscriber
[program:mqtt_subscriber]
directory=/app
command=python -u backend/mqtt_subscriber.py
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
priority=998
stdout_logfile=/var/log/supervisor/mqtt_subscriber_out.log
stderr_logfile=/var/log/supervisor/mqtt_subscriber_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED=1

# Alert Manager (if running as separate service)
# [program:alert_manager]
# directory=/app
# command=python -u backend/alert_manager.py
# autostart=true
# autorestart=true
# startsecs=5
# stopwaitsecs=10
# priority=997
# stdout_logfile=/var/log/supervisor/alert_manager_out.log
# stderr_logfile=/var/log/supervisor/alert_manager_err.log

# Nginx reverse proxy
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
priority=100
stdout_logfile=/var/log/supervisor/nginx_out.log
stderr_logfile=/var/log/supervisor/nginx_err.log

# Mosquitto MQTT Broker
# [program:mosquitto]
# command=/usr/sbin/mosquitto -c /etc/mosquitto/mosquitto.conf
# autostart=true
# autorestart=true
# startsecs=5
# stopwaitsecs=10
# priority=101
# stdout_logfile=/var/log/supervisor/mosquitto_out.log
# stderr_logfile=/var/log/supervisor/mosquitto_err.log

# Group definitions
[group:landslide]
programs=flask_app,mqtt_subscriber,nginx

[eventlistener:processes]
command=tail -F /var/log/supervisor/supervisord.log
events=PROCESS_STATE
buffer_size=100

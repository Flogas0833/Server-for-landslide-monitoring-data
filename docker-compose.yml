# ============================================================================
# Docker Compose for Local Development & Testing
# Usage: docker-compose up
# ============================================================================

services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: landslide-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - landslide-net
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-h", "localhost", "-t", "test" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend Flask API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landslide-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - DATABASE_URL=sqlite:///./database/sensors.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DB_AUTO_INIT=true
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - ./logs:/app/logs
    depends_on:
      - mosquitto
    networks:
      - landslide-net
    command: python -m flask run --host=0.0.0.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Dev Server
  frontend:
    image: node:20-alpine
    container_name: landslide-frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - landslide-net
    command: sh -c "npm install && npm run dev"

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: landslide-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - landslide-net
  # PostgreSQL (Alternative to SQLite for production-like testing)
  # Uncomment to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: landslide-postgres
  #   environment:
  #     POSTGRES_USER: landslide_user
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  #     POSTGRES_DB: landslide_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - landslide-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U landslide_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  landslide-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_logs: # postgres_data:
